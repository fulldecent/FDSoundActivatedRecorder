name: FDSoundActivatedRecorder CI

# The simulator job follows the macOS job in Swift 6 Module Template 16.5.0
# (.github/workflows/swiftlang-workflows.yml). That job uses the GitHub-hosted
# xcode-27 image because macos-26 stops at Xcode 26.
# https://github.blog/changelog/2026-07-16-xcode-27-runner-image-now-in-public-preview/
# This package imports AVFoundation and declares .iOS(.v16), so the destination
# is an iPhone simulator. `xcrun swift test` does not build it.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: iOS simulator tests
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [[ -z "$UDID" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme FDSoundActivatedRecorder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            test
