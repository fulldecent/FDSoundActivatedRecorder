name: FDSoundActivatedRecorder CI

on:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/**"
      - "Package.swift"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - ".github/workflows/**"
      - "Package.swift"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: iOS simulator tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [[ -z "$UDID" ]]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme FDSoundActivatedRecorder \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            test
